<header class="navbar">
    <div class="navbar-content">
        <a href="{% url 'index' %}" class="brand">📦 Gestão de Produtos</a>
        <nav class="nav-links">
            <a href="{% url 'index' %}">Início</a>
            <a href="{% url 'signup' %}">Cadastro de Usuário</a>
            {% if user.is_authenticated %}
                <a href="{% url 'product_create' %}">Cadastro de Produtos</a>
                <a href="{% url 'product_list' %}">Produtos</a>
                <span class="nav-user">Olá, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Login</a>
            {% endif %}
        </nav>
    </div>
</header>
